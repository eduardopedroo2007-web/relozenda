 stepParts(dt);

 for(let y=-OY;y<80;y+=2){ctx.fillStyle='rgb('+mixc(sk.top,sk.bot,clamp(y/78,0,1)).map(v=>v|0).join()+')';ctx.fillRect(-OX-8,y,W+16,2)}

 if(ht>5.8&&ht<18.2){const k=clamp((ht-6)/12,0,1),x=lerp(24,296,k),y=76-Math.sin(k*Math.PI)*62;ctx.globalAlpha=.18;R(x-9,y-9,18,18,'#ffe58a');ctx.globalAlpha=1;R(x-5,y-5,10,10,'#ffd45a')}
 if(ht>=18||ht<6){const k=ht>=18?(ht-18)/12:(ht+6)/12,x=lerp(24,296,k),y=76-Math.sin(k*Math.PI)*58;ctx.globalAlpha=.15;R(x-8,y-8,16,16,'#fff');ctx.globalAlpha=1;R(x-4,y-4,8,8,'#eceac8');R(x-1,y-2,4,4,'#d6d4b0')}
 for(const c of CL){c.x+=c.s*dt;if(c.x>W-OX+10)c.x=-OX-c.w-10;ctx.globalAlpha=(isRaining?.55:.9)*(1-sk.nf*.8)+.12;R(c.x,c.y+3,c.w,4,'#fff');R(c.x+4,c.y,c.w-12,4,'#fff');R(c.x+c.w*.3,c.y-2,c.w*.3,3,'#fff')}ctx.globalAlpha=1;
 if(isRaining){ctx.fillStyle='rgba(70,80,95,.35)';ctx.fillRect(-OX,-OY,W,OY+76)}

 ctx.globalAlpha=.4;for(let i=0;i<7;i++)R(246+i*9+Math.sin(t+i)*2,160+(i%3)*5,4,1,'#e8f6ff');ctx.globalAlpha=1;
 drawBarn(inside?1:sk.nf,boomed);
 if(!boomed){const stg=r=>clamp(Math.floor(prog*3.7+r*.05),0,3);cells.forEach(c=>{if(!c.hAt)crop(c,stg(c.c))})}
 else{R(CRATER.x-40,CRATER.y-10,80,20,'#3b3326');R(CRATER.x-20,CRATER.y-5,40,10,'#120e0a')}

 for(let i=0;i<3;i++){const hx=hen(i,t).x,hy=hen(i,t).y,pk=Math.sin(t*5+i)>.7?1:0;items.push({y:hy+5,f:()=>SPR(HEN,HP,hx,hy+pk,Math.cos(t*.6+i*2)<0)})}
 let fire=null;const k=(mode==='finale'||mode==='after')?'final':isRaining?'abrigo':A[hr].k,tg=pose(k,t,T);
 if(fx===null){fx=tg.x;fy=tg.y}
 if(k!==lastK){lastK=k;bT=t+5;bE=k==='abrigo'?'☔':A[hr].e}
 const dx=tg.x-fx,dy=tg.y-fy,dist=Math.hypot(dx,dy),spd=(k==='abrigo'?60:k==='final'?90:k==='festa'?200:26)*dt;
 if(dist>spd){fx+=dx/dist*spd;fy+=dy/dist*spd}else{fx=tg.x;fy=tg.y}

 if(po.hide&&k==='dormir'&&Math.random()<dt*1.5)P('zzz',26,66,rnd(5,12),-9,3,'#fff');

  if(wk&&Math.random()<dt*7)P('d',po.x+(dir>0?12:-1),py+9,dir*rnd(4,14),rnd(-22,-6),.5,PM[k],1,120);

/* ===== relógio ===== */
const cap=$('cap');let prevDiff=null,lastHour=null,typeTimer=null;
function tick(){const now=new Date(),ms=now.getTime(),fmt=(d,o)=>d.toLocaleDateString('pt-BR',o);
 const ds=fmt(now,{weekday:'long',day:'numeric',month:'long'});$('date').textContent=ds[0].toUpperCase()+ds.slice(1);
 $('ch').textContent=pad(now.getHours());$('cm').textContent=pad(now.getMinutes());$('cs').textContent=pad(now.getSeconds());

 const diff=view.target-ms;
 if(prevDiff===null){if(diff<=0&&mode==='normal'){mode='after';boomed=true;cells.forEach(c=>c.hAt=1)}}else if(prevDiff>0&&diff<=0&&mode==='normal')startFinale();
 prevDiff=diff;const tot=Math.max(0,Math.floor(diff/1000));
 $('dd').textContent=Math.floor(tot/86400);$('hh').textContent=pad(Math.floor(tot%86400/3600));$('mm').textContent=pad(Math.floor(tot%3600/60));$('ss').textContent=pad(tot%60);
 prog=clamp((ms-view.start)/(view.target-view.start),0,1);

 $('pb').style.width=(prog*100).toFixed(1)+'%';$('pe').textContent=prog<.25?'🌱':prog<.55?'🌿':prog<.85?'🌷':'🌻';
 $('pb').title=Math.round(prog*100)+'%';
 const hr=now.getHours(),a=A[hr],n=A[(hr+1)%24];
 const txt=mode==='finale'?'🧑‍🌾 Corre, fazendeiro! Fim da contagem!':mode==='after'?'💥 Tudo foi pelos ares!':isRaining?'☔ Chuva! Ele correu pro celeiro e espera passar':a.e+' '+pad(hr)+'h: '+a.n;
 if(cap.dataset.t!==txt){cap.dataset.t=txt;cap.innerHTML=txt}
 if(lastHour===null){lastHour=hr;hourEvent(hr,false)}else if(hr!==lastHour){lastHour=hr;hourEvent(hr,true)}}
const loop=()=>{tick();setTimeout(loop,1000-Date.now()%1000)};
function typeMsg(s){clearInterval(typeTimer);const ch=Array.from(s);let i=0;$('dtext').textContent='';$('dlg').classList.remove('done');

let dTimer;function showDlg(){const b=document.querySelector('.hud.bot');b.classList.add('show');clearTimeout(dTimer);dTimer=setTimeout(()=>b.classList.remove('show'),15000)}
function hourEvent(hr,ann){const msg=MSGS[(new Date().getDate()+hr)%MSGS.length];$('who').textContent='Conselho das '+pad(hr)+'h';typeMsg(msg);
 if(ann&&mode==='normal'){const d=$('dlg');d.classList.remove('ping');void d.offsetWidth;d.classList.add('ping');chime()}if(mode==='normal')showDlg()}

/* ===== som ===== */
const ac=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}};
function note(f,t0,d){if(!snd||!AC)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+t0;o.frequency.value=f;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.05,n+.03);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+d+.05)}
const chime=()=>[523.25,659.25,783.99,1046.5].forEach((f,i)=>note(f,i*.18,1.5));
function boomSound(){if(!snd||!AC)return;const n=AC.sampleRate*1.2|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=.5;s.buffer=b;s.connect(g).connect(AC.destination);s.start()}

$('mb').onclick=e=>{e.stopPropagation();$('mp').classList.toggle('on')};addEventListener('click',e=>{if(!e.target.closest('#mp'))$('mp').classList.remove('on')});$('mp').addEventListener('click',e=>{if(e.target.id==='bBr'||e.target.id==='bFinal')$('mp').classList.remove('on')});
size();addEventListener('resize',size);loop();requestAnimationFrame(render);
})();
